name: Build optimized static site
on:
  workflow_dispatch:
  push:
    branches:
      - improve/mobile-seo-performance-20261015
    paths:
      - '.github/workflows/optimize.yml'
permissions:
  contents: write
jobs:
  optimize:
    if: github.ref == 'refs/heads/improve/mobile-seo-performance-20261015'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install 'Pillow>=10,<12'
      - name: Generate responsive WebP images
        run: python scripts/build_assets.py
      - name: Compile Tailwind
        run: npm run build:css
      - name: Replace Tailwind CDN after successful build
        run: python scripts/finalize_build.py
      - name: Sanity checks
        run: |
          test -s assets/site.css
          ! grep -R 'cdn.tailwindcss.com' --include='*.html' .
          test -f images/legacy/2012-1.webp
          git status --short
      - name: Commit generated assets to development branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.css images/optimized '*.html' package-lock.json
          git diff --cached --quiet || git commit -m "Build production Tailwind CSS and optimized responsive images"
          git push origin HEAD:improve/mobile-seo-performance-20261015
